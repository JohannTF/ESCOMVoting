spring.application.name=escomvoting
spring.config.import=optional:file:.env[.properties]

# Database
spring.datasource.url=${APP_DB_URL}
spring.datasource.username=${APP_DB_USERNAME}
spring.datasource.password=${APP_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiry-ms=86400000

# Crypto — AES-256 key for encrypting election EC private keys at rest
app.crypto.election-key-secret=${APP_CRYPTO_ELECTION_KEY_SECRET}

# Mail — Gmail SMTP (credentials come from the environment / .env)
spring.mail.host=${APP_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${APP_MAIL_PORT:587}
spring.mail.username=${APP_MAIL_USERNAME:}
spring.mail.password=${APP_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.enabled=${APP_MAIL_ENABLED:true}
app.mail.from=${APP_MAIL_FROM:escomvoting@gmail.com}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:44100}

# Server
server.port=8080

app.cors.allowed-origins=${app.frontend.url}

# Bootstrap admin user (created if missing)
app.admin.institutional-id=ADMIN-0001
app.admin.email=admin@escom.ipn.mx
app.admin.name=Administrador Sistema
app.admin.password=Admin1234!
